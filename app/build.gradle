plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ncmdump.app'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.ncmdump.app"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "1.8"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../release.jks")
            storePassword "ncmdump123"
            keyAlias "ncmdump"
            keyPassword "ncmdump123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // APK 输出文件名
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "MuLing-Tool-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-full:7.1.5'
}
