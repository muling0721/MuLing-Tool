plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ncmdump.app'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.muling"
        minSdk 24
        targetSdk 34
        versionCode 45
        versionName "1.6"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    signingConfigs {
        release {
            // 优先读取环境变量（CI 通过 Secrets 注入），否则回退到本地路径/默认口令
            def envStoreFile = System.getenv("SIGNING_KEYSTORE_FILE")
            def envStorePass = System.getenv("SIGNING_STORE_PASSWORD")
            def envKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
            def envKeyPass = System.getenv("SIGNING_KEY_PASSWORD")
            storeFile file(envStoreFile ?: "../release.jks")
            storePassword envStorePass ?: "ncmdump123"
            keyAlias envKeyAlias ?: "ncmdump"
            keyPassword envKeyPass ?: "ncmdump123"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".beta"
            signingConfig signingConfigs.release
        }
        release {
            applicationIdSuffix ".tool"
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // APK 输出文件名
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.buildType.name == "debug"
                ? "MuLing-Tool-Beta-v${variant.versionName}.apk"
                : "MuLing-Tool-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-full:7.1.5'
}
