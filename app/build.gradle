plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.ncmdump.app'
    compileSdk 37
    buildToolsVersion "36.1.0"
    ndkVersion "30.0.16248370"

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId "com.muling"
        minSdk 24
        targetSdk 37
        versionCode 54
        versionName "2.1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions"
            }
        }
    }

    signingConfigs {
        release {
            // 优先读取环境变量（CI 通过 Secrets 注入），否则回退到本地路径/默认口令
            def envStoreFile = System.getenv("SIGNING_KEYSTORE_FILE")
            def envStorePass = System.getenv("SIGNING_STORE_PASSWORD")
            def envKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
            def envKeyPass = System.getenv("SIGNING_KEY_PASSWORD")
            storeFile file(envStoreFile ?: "../release.jks")
            storePassword envStorePass ?: "ncmdump123"
            keyAlias envKeyAlias ?: "ncmdump"
            keyPassword envKeyPass ?: "ncmdump123"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".beta"
            signingConfig signingConfigs.release
        }
        release {
            applicationIdSuffix ".tool"
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // .so 压缩进 APK，包里小很多
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // 底栏玻璃用的背景采样 / 折射库
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'

    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation 'io.github.maitrungduc1410:ffmpeg-kit-audio:7.1.5'
}
