name: gen-keystore

# One-off helper: generates the release keystore in CI and exposes it as base64
# so it can be stored in repository secrets. Safe to delete after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e
          keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=MuLing Tool, OU=MuLing, O=MuLing, C=CN"
          base64 -w0 release.jks > keystore.b64
          echo "base64 length: $(wc -c < keystore.b64)"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
