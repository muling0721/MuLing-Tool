name: probe-parsers

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe douyin/kuaishou parse APIs
        run: |
          set +e
          DY="https://v.douyin.com/iRNBho6u/"
          probe () {
            local name="$1"; local url="$2"
            local code body
            body="$(curl -s -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36" -w $'\n%{http_code}' "$url" 2>/dev/null || true)"
            code="$(printf '%s' "$body" | tail -n1)"
            printf '===== %s\n[http %s] %s\n%s\n\n' "$name" "$code" "$url" "$(printf '%s' "$body" | sed '$d' | head -c 400)"
          }
          echo "### DOUYIN"
          probe "tikwm"          "https://www.tikwm.com/api/?url=$DY"
          probe "tikwm2"         "https://tikwm.com/api/?url=$DY"
          probe "douyin-wtf-hybrid" "https://api.douyin.wtf/api/hybrid/video_data?url=$DY&minimal=false"
          probe "douyin-wtf-api" "https://api.douyin.wtf/api?url=$DY"
          probe "tiklydown"      "https://api.tiklydown.eu.org/api/download?url=$DY"
          probe "douyin-wtf-root" "https://douyin.wtf/api/hybrid/video_data?url=$DY"
          probe "xingzhige"      "https://api.xingzhige.com/API/douyin/?url=$DY"
          probe "xingzhige-wm"   "https://api.xingzhige.com/API/douyinWM/?url=$DY"
          probe "pearktrue"      "https://api.pearktrue.cn/api/douyin/?url=$DY"
          probe "kxzjoker"       "https://api.kxzjoker.cn/API/douyin.php?url=$DY"
          probe "oioweb"         "https://api.oioweb.cn/api/common/douyin?url=$DY"
          probe "52vmy"          "https://api.52vmy.cn/api/video/dy?url=$DY"
          probe "lolimi"         "https://api.lolimi.cn/API/douyin/api.php?url=$DY"
          probe "yujn"           "https://api.yujn.cn/api/douyin.php?url=$DY"
          probe "toubiec"        "https://api.toubiec.cn/API/douyin.php?url=$DY"
          probe "kuleu"          "https://api.kuleu.com/api/douyin?url=$DY"
          probe "uomg"           "https://api.uomg.com/api/douyin?url=$DY"
          probe "mir6"           "https://api.mir6.com/api/douyin?url=$DY"
          probe "hanzify"        "https://api.hanzify.com/api/douyin?url=$DY"
          probe "v2.52vmy"       "https://api.52vmy.cn/api/video/ks?url=$DY"
          probe "dujin"          "https://api.dujin.org/parse/dy/?url=$DY"
          echo "### KUAISHOU"
          probe "xingzhige-ks"   "https://api.xingzhige.com/API/kuaishou/?url=https://v.kuaishou.com/abc"
          probe "pearktrue-ks"   "https://api.pearktrue.cn/api/ks/?url=https://v.kuaishou.com/abc"
          probe "oioweb-ks"      "https://api.oioweb.cn/api/common/kuaishou?url=https://v.kuaishou.com/abc"
